name: CI to Docker Hub

on:
  push:
    branches: [ main ]
  schedule:
    # change detection: rebuilds only entries whose php base image or MediaWiki ref changed
    - cron: '17 */6 * * *'
    # forced rebuild of everything, picks up Debian updates for the packages installed by the template
    - cron: '43 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild all selected entries, even if nothing changed'
        type: boolean
        default: false
      dry_run:
        description: 'Build amd64 only: do not push images and do not trigger the downstream build'
        type: boolean
        default: false
      mediawiki_version:
        description: 'Only this MediaWiki major version (e.g. 1.43); empty = all'
        type: string
        default: ''
      php_version:
        description: 'Only this PHP version (e.g. 8.2); empty = all'
        type: string
        default: ''

# scheduled, manual and push runs must not race on the same tags
concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: gesinn/mediawiki-base

jobs:

  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      majors: ${{ steps.plan.outputs.majors }}
      build_timestamp: ${{ steps.plan.outputs.build_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Plan
        id: plan
        env:
          # the weekly schedule is the forced rebuild
          FORCE: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 3 * * 0') || inputs.force == true }}
          ALWAYS_BUILD: ${{ github.event_name == 'push' }}
          ONLY_MEDIAWIKI: ${{ inputs.mediawiki_version }}
          ONLY_PHP: ${{ inputs.php_version }}
        run: |
          matrix="$(./plan.sh)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "majors=$(jq -c '[.[].mediawiki_version] | unique' matrix.json)" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == "[]" ]]; then
            echo "Nothing to rebuild: php base images and MediaWiki refs are unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.mediawiki_version }}, ${{ matrix.php_version }})
    env:
      PHP_BASE_DIGEST: ${{ matrix.php_base_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reason
        run: echo "Rebuilding because ${{ matrix.reason }}"

      - name: Generate dockerfile
        run: |
          ./generate_dockerfile.sh ${{matrix.mediawiki_version}} ${{matrix.php_version}} "${PHP_BASE_DIGEST}"

      - name: Retrieve MediaWiki version
        run: |
          source ./helpers.sh
          mw_ref="$(mediawiki_ref ${{matrix.mediawiki_version}})"
          IFS=':' read -r mw_type mw_value mw_sha <<< "$mw_ref"
          echo "MEDIAWIKI_REF_TYPE=${mw_type}" >> $GITHUB_ENV
          if [[ "$mw_type" == "tag" ]]; then
            echo "MEDIAWIKI_FULL_VERSION=${mw_value}" >> $GITHUB_ENV
          else
            echo "MEDIAWIKI_FULL_VERSION=${{matrix.mediawiki_version}}-dev-${mw_sha:0:7}" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache/${{ matrix.mediawiki_version }}/php-${{ matrix.php_version }}/apache
          key: ${{ runner.os }}-buildx-${{ matrix.mediawiki_version }}-${{ matrix.php_version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.mediawiki_version }}-${{ matrix.php_version }}-


      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}


      - name: Determine effective PHP version
        run: |
          php_full="$(docker run --rm "php:${{ matrix.php_version }}-apache@${PHP_BASE_DIGEST}" php -r 'echo PHP_VERSION;')"
          echo "PHP_FULL_VERSION=${php_full}" >> $GITHUB_ENV

      - name: Set image metadata
        run: echo "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: generate tags for image
        run: |
          source ./helpers.sh
          tags="$(generate_tags "${IMAGE_REPOSITORY}" "${{ env.MEDIAWIKI_FULL_VERSION }}" "${{ matrix.mediawiki_version }}" "${{ matrix.php_version }}" "${{ matrix.php_default }}" "${{ env.MEDIAWIKI_REF_TYPE }}" "${{ needs.plan.outputs.build_timestamp }}")"
          echo "TAGS=${tags}" >> $GITHUB_ENV

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          network: host
          allow: network.host
          pull: true
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ env.TAGS }}
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.mediawiki_version }}/php-${{matrix.php_version}}/apache
          cache-to: type=local,dest=/tmp/.buildx-cache/${{ matrix.mediawiki_version }}/php-${{matrix.php_version}}/apache
          # a dry run only builds amd64 (no QEMU emulation), which is much faster
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          labels: |
            org.opencontainers.image.base.name=docker.io/library/php:${{ matrix.php_version }}-apache
            org.opencontainers.image.base.digest=${{ env.PHP_BASE_DIGEST }}
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.MEDIAWIKI_FULL_VERSION }}
            it.gesinn.php.version=${{ env.PHP_FULL_VERSION }}
            it.gesinn.mediawiki.version=${{ env.MEDIAWIKI_FULL_VERSION }}
          annotations: |
            index:org.opencontainers.image.base.name=docker.io/library/php:${{ matrix.php_version }}-apache
            index:org.opencontainers.image.base.digest=${{ env.PHP_BASE_DIGEST }}
            index:org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ env.MEDIAWIKI_FULL_VERSION }}
            index:it.gesinn.php.version=${{ env.PHP_FULL_VERSION }}
            index:it.gesinn.mediawiki.version=${{ env.MEDIAWIKI_FULL_VERSION }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      # Only reached after a successful push, i.e. exactly for the combinations that were rebuilt.
      - name: Trigger downstream build
        if: matrix.downstream && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
        run: |
          gh workflow run main.yml \
            --repo gesinn-it/docker-mediawiki \
            --ref "${{ matrix.downstream_ref }}" \
            -f mediawiki_version=${{ matrix.mediawiki_version }} \
            -f php_version=${{ matrix.php_version }} \
            -f build_timestamp=${{ needs.plan.outputs.build_timestamp }}


  cleanup-dev-tags:
    runs-on: ubuntu-24.04
    needs: [plan, build]
    if: needs.build.result == 'success' && !inputs.dry_run
    strategy:
      matrix:
        mediawiki_version: ${{ fromJSON(needs.plan.outputs.majors) }}
    env:
      IMAGE_NAMESPACE: gesinn
      IMAGE_REPOSITORY: mediawiki-base
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup old dev images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source ./helpers.sh

          hub_api="https://hub.docker.com/v2"
          hub_repo="${hub_api}/repositories/${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}"

          auth_payload="$(jq -cn --arg u "$DOCKER_HUB_USERNAME" --arg p "$DOCKER_HUB_ACCESS_TOKEN" '{username:$u,password:$p}')"
          hub_jwt="$(curl -fsSL -H 'Content-Type: application/json' -X POST "${hub_api}/users/login/" -d "$auth_payload" | jq -r '.token')"

          if [[ -z "$hub_jwt" || "$hub_jwt" == "null" ]]; then
            echo "Failed to authenticate against Docker Hub API" >&2
            exit 1
          fi

          tags_file="$(mktemp)"
          page_url="${hub_repo}/tags?page_size=100"
          while [[ -n "$page_url" && "$page_url" != "null" ]]; do
            page_json="$(curl -fsSL -H "Authorization: JWT ${hub_jwt}" "$page_url")"
            jq -r '.results[] | [.name, .last_updated] | @tsv' <<< "$page_json" >> "$tags_file"
            page_url="$(jq -r '.next' <<< "$page_json")"
          done

          if [[ ! -s "$tags_file" ]]; then
            echo "No tags found in repository ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}; nothing to clean up."
            exit 0
          fi

          major="${{ matrix.mediawiki_version }}"

          # Immutable per-build tags (<version>-php<v>-apache-YYYYMMDDTHHMM): keep the latest 8 per MediaWiki major + PHP version.
          # Runs first because the dev cleanup below exits early when there is nothing to do.
          mapfile -t old_build_tags < <(
            awk -F '\t' -v m="$major" -v d8='[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]' -v d4='[0-9][0-9][0-9][0-9]' '
              match($1, "^" m "[.-].*-php[0-9.]+-apache-" d8 "T" d4 "$") {
                tag = $1
                ts = substr(tag, length(tag) - 12)
                prefix = substr(tag, 1, length(tag) - 14)
                sub(/^.*-php/, "", prefix)
                print prefix "\t" ts "\t" tag
              }
            ' "$tags_file" | sort -t $'\t' -k1,1 -k2,2r | awk -F '\t' '{ if (++n[$1] > 8) print $3 }'
          )
          for tag_name in "${old_build_tags[@]}"; do
            echo "Deleting ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}:${tag_name} (retention: latest 8 build tags)"
            curl -fsSL -X DELETE -H "Authorization: JWT ${hub_jwt}" "${hub_repo}/tags/${tag_name}/" > /dev/null || true
          done
          ref_info="$(mediawiki_ref "$major")"
          IFS=':' read -r ref_type _ _ <<< "$ref_info"

          mapfile -t dev_build_keys < <(
            awk -v m="$major" -F '\t' '
              $1 ~ ("^" m "-dev-[0-9a-f]{7}(-|$)") {
                if (match($1, "^" m "-dev-[0-9a-f]{7}")) {
                  key = substr($1, RSTART, RLENGTH)
                  print key
                }
              }
            ' "$tags_file" | sort -u
          )

          if [[ ${#dev_build_keys[@]} -eq 0 ]]; then
            echo "No dev tag groups for ${major}; skipping."
            exit 0
          fi

          mapfile -t sorted_groups < <(
            awk -v m="$major" -F '\t' '
              $1 ~ ("^" m "-dev-[0-9a-f]{7}(-|$)") {
                if (match($1, "^" m "-dev-[0-9a-f]{7}")) {
                  key = substr($1, RSTART, RLENGTH)
                  ts = $2
                  if (!(key in latest) || ts > latest[key]) {
                    latest[key] = ts
                  }
                }
              }
              END {
                for (k in latest) {
                  print latest[k] "\t" k
                }
              }
            ' "$tags_file" | sort -r | awk -F '\t' '{print $2}'
          )

          delete_from_index=0
          if [[ "$ref_type" == "tag" ]]; then
            echo "Stable tag available for ${major}; deleting all dev build groups (${#sorted_groups[@]})."
          else
            delete_from_index=5
            if [[ ${#sorted_groups[@]} -le 5 ]]; then
              echo "${major} remains in dev mode; ${#sorted_groups[@]} groups <= 5, nothing to delete."
              exit 0
            fi
            echo "${major} remains in dev mode; deleting groups older than latest 5 (total ${#sorted_groups[@]})."
          fi

          for ((i = delete_from_index; i < ${#sorted_groups[@]}; i++)); do
            group="${sorted_groups[$i]}"
            mapfile -t tags_to_delete < <(awk -v g="$group" -F '\t' '$1 ~ ("^" g "(-|$)") {print $1}' "$tags_file")
            for tag_name in "${tags_to_delete[@]}"; do
              echo "Deleting ${IMAGE_NAMESPACE}/${IMAGE_REPOSITORY}:${tag_name}"
              curl -fsSL -X DELETE -H "Authorization: JWT ${hub_jwt}" "${hub_repo}/tags/${tag_name}/" > /dev/null
            done
          done
